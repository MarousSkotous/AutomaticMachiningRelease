name: Build published installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.4.0
        required: true

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer and portable ZIP
        shell: pwsh
        run: |
          $version = '${{ inputs.tag }}'.TrimStart('v')
          $manifest = Get-Content build\release\AutomaticMachining\AutomaticMachining.manifest | ConvertFrom-Json -AsHashtable
          if ($version -ne $manifest['version']) { throw "Tag version $version does not match package $($manifest['version'])" }
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DAM_VERSION=$version" installer\AutomaticMachining.iss
          Compress-Archive -Path build\release\AutomaticMachining -DestinationPath build\release\AutomaticMachining-Windows.zip -Force
          $path = 'build\release\AutomaticMachining-Windows-Setup.exe'
          $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLower()
          "$hash  AutomaticMachining-Windows-Setup.exe" | Set-Content "$path.sha256" -Encoding ascii

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = @(
            'build/release/AutomaticMachining-Windows-Setup.exe',
            'build/release/AutomaticMachining-Windows-Setup.exe.sha256',
            'build/release/AutomaticMachining-Windows.zip'
          )
          gh release view '${{ inputs.tag }}' 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release ${{ inputs.tag }} already exists and will not be overwritten." }
          gh release create '${{ inputs.tag }}' `
            --title "Automatic Machining ${{ inputs.tag }}" `
            --notes "Windows installer and portable Fusion add-in package." `
            @assets
